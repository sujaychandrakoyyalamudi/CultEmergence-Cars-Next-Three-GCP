name: deploy-production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require reviewed dependency lock
        run: test -f package-lock.json

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push immutable image
        run: >-
          gcloud builds submit .
          --config cloudbuild.yaml
          --substitutions=_REGION=${{ vars.GCP_REGION }},_REPOSITORY=cultemergence,_IMAGE=cars-web,_TAG=${{ github.sha }}

      - name: Deploy the built image to Cloud Run
        run: >-
          gcloud run services update cultemergence-cars
          --project=${{ vars.GCP_PROJECT_ID }}
          --region=${{ vars.GCP_REGION }}
          --image=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cultemergence/cars-web:${{ github.sha }}
          --quiet

      - name: Production smoke check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --retry 5 --retry-all-errors "$PRODUCTION_URL/api/health"
