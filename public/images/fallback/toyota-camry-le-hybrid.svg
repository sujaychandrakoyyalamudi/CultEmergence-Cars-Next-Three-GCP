<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Toyota Camry LE Hybrid abstract fallback illustration</title>
<desc id="desc">An original geometric car silhouette used when the remote open-license photograph cannot load.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0c10"/><stop offset="1" stop-color="#1b1f27"/></linearGradient>
 <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#57d9ff"/><stop offset="1" stop-color="#ffffff" stop-opacity=".32"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<ellipse cx="620" cy="340" rx="390" ry="185" fill="#57d9ff" opacity=".14" filter="url(#blur)"/>
<path d="M188 435 C250 350, 315 330, 395 322 L475 300 C535 215, 725 207, 815 300 L955 335 C1010 342, 1040 385, 1038 435 Z" fill="url(#paint)" stroke="#fff" stroke-opacity=".24" stroke-width="3"/>
