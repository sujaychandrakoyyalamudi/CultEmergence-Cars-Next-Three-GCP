<path d="M963 390 H1028" stroke="#ff3d2e" stroke-width="11" stroke-linecap="round"/>
<text x="70" y="82" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700">CULTEMERGENCE</text>
